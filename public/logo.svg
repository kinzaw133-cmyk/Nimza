<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="40" fill="#FAFAF8"/>
  
  <!-- Steam Swirl in Luxury Gold -->
  <path d="M 250 85 Q 262 100 248 115 Q 236 128 250 138" fill="none" stroke="#B99A5B" stroke-width="5.5" stroke-linecap="round"/>
  
  <!-- Steaming Bowl in Deep Charcoal Olive -->
  <ellipse cx="250" cy="148" rx="46" ry="8" fill="#B99A5B"/>
  <path d="M 204 148 C 204 195, 296 195, 296 148 Z" fill="#1F241F"/>
  
  <!-- Heart Cutout inside Bowl in Ivory -->
  <path d="M 250 178 C 248 175, 236 164, 236 156 C 236 150, 241 147, 245 147 C 248 147, 250 150, 250 150 C 250 150, 252 147, 255 147 C 259 147, 264 150, 264 156 C 264 164, 252 175, 250 178 Z" fill="#FAFAF8"/>

  <!-- Brand Wordmark: Nimza in Retro Rounded Serif Style -->
  <text x="250" y="275" text-anchor="middle" font-family="'Playfair Display', 'Cooper Black', 'Georgia', serif" font-weight="900" font-size="82" fill="#1F241F" letter-spacing="-1.5">Nimza</text>

  <!-- Subtitle: · RESTAURANT · -->
  <g fill="#B99A5B" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="7.5">
    <circle cx="128" cy="314" r="3"/>
    <text x="256" y="320" text-anchor="middle">RESTAURANT</text>
    <circle cx="384" cy="314" r="3"/>
  </g>

  <!-- Tagline: From our kitchen to your table. -->
  <text x="250" y="365" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="500" font-size="18" fill="#1F241F" opacity="0.85">From our kitchen to your table.</text>

  <!-- Bottom Heart Accent -->
  <path d="M 250 405 C 248 402, 239 393, 239 387 C 239 382, 243 379, 246 379 C 248.5 379, 250 381.5, 250 381.5 C 250 381.5, 251.5 379, 254 379 C 257 379, 261 382, 261 387 C 261 393, 252 402, 250 405 Z" fill="none" stroke="#B99A5B" stroke-width="2"/>
</svg>
